# Máy PES17 (PO ok 18/11 "làm tiếp phần máy 2 người"): thay định nghĩa ~/pes6/pes17-web (không sửa bên đó).
# Chạy: tools/bench/up.sh (tạo vé chủ SELKIES_MASTER_TOKEN trong $DATA/bench.env nếu chưa có, không in ra).
# Chế độ token: chỉ người có link vé của trận vào được (web cấp qua pes-tokens.py), máy tự bấm bằng vé pad.
name: pes17-web
services:
  bench:
    build: .
    image: pes17-bench:local
    container_name: pes17-bench
    shm_size: "1gb"
    devices: ["/dev/dri:/dev/dri"]
    cpuset: "2-11"
    mem_limit: 8g
    memswap_limit: 8g   # 18/11: không cho game dùng swap (giật hình)
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Ho_Chi_Minh
      SELKIES_ENCODER: x264enc
      SELKIES_VIDEO_BITRATE: "8-18"   # khoảng: trang chơi (pes-overlay.js) tự đặt 18, nút "Giảm giật" hạ 8 (PO 22/11)
      SELKIES_FRAMERATE: "60"
      SELKIES_H264_STREAMING_MODE: "true"   # mã hoá cả khung: đều 60 khung/s (đo 23/11), theo dải 53–58 + khựng; pes-overlay.js cũng gửi
      SELKIES_ENABLE_RATE_CONTROL: "true"
      SELKIES_RATE_CONTROL_MODE: cbr
      # Độ phân giải màn + game (PO 26/11 đồ hoạ nhoè → 1080p). Máy nặng: PES17_W=1600 PES17_H=900 up.sh; về cũ: 1280/720.
      SELKIES_MANUAL_WIDTH: "${PES17_W:-1920}"
      SELKIES_MANUAL_HEIGHT: "${PES17_H:-1080}"
      DRINODE: /dev/dri/renderD128
      DRI_NODE: /dev/dri/renderD128
      SELKIES_MASTER_TOKEN: ${SELKIES_MASTER_TOKEN:?thiếu bench.env}
      SELKIES_UI_SHOW_SIDEBAR: "false"
      SELKIES_UI_SHOW_LOGO: "false"
      SELKIES_UI_TITLE: "PES 17 League"
    ports: ["100.66.228.1:3117:3001"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    volumes:
      - /data/pesleague/pes17/config:/config
      - /data/pesleague/pes17/bench:/bench
      - /data/pesleague/pes17/game:/game:ro
      - ./startwm.sh:/defaults/startwm.sh:ro
      - ./pes-tokens.py:/usr/local/bin/pes-tokens.py:ro
